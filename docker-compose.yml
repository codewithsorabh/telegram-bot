services:
  postgres:
    image: ghcr.io/microsoft/pg_durable:pg17
    container_name: postgres
    restart: unless-stopped

    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_durable",
        "-c",
        "pg_durable.database=${POSTGRES_DB}",
        "-c",
        "pg_durable.worker_role=${POSTGRES_USER}",
      ]

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      TZ: Asia/Kolkata

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - backend

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: aibot:latest
    container_name: aibot_bot
    restart: unless-stopped
    command: ["python", "./bot/bot.py"]

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - backend

  userbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: aibot:latest
    container_name: aibot_userbot
    restart: unless-stopped
    command: ["python", "./userbot/main.py"]

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    name: backend
